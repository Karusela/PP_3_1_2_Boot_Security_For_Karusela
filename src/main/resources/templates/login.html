<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
          integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
    <title>Login</title>
</head>
<body class="bg-light">

<div class="container d-flex flex-column justify-content-start align-items-center" style="height: 100vh; padding-top: 120px;">
    <h1 class="mb-4 text-center">Please sign in</h1>

    <form th:action="@{/}" method="post" style="max-width: 300px; width: 100%;">
        <div class="mb-3">
            <input type="email" name="email" class="form-control" placeholder="Email" required />
        </div>
        <div class="mb-3">
            <input type="password" name="password" class="form-control" placeholder="Password" required />
        </div>
        <div>
            <input type="submit" value="Login" class="btn btn-primary" style="width: 100%; padding: 10px 0;" />
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ho+j7jyWK8fNQe+A12hVt6Ckc1lvE93SU3LkW+5PaXtkKtu6ug5TOeNV6gBiFeW4" crossorigin="anonymous"></script>
</body>
</html>
