<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="editUserForm">
    <div class="modal fade" id="editUserModal" tabindex="-1" aria-labelledby="editUserModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit User</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form th:action="@{/admin/edit}" th:object="${user}" method="post">
                    <div class="modal-body">
                        <input type="hidden" th:field="*{id}" id="editId"/>

                        <div class="mb-3 text-center">
                            <label for="editName" class="form-label fw-bold">First name</label>
                            <input type="text" id="editName" th:field="*{name}"
                                   class="form-control form-control-custom"/>
                        </div>

                        <div class="mb-3 text-center">
                            <label for="editSurname" class="form-label fw-bold">Last name</label>
                            <input type="text" id="editSurname" th:field="*{surname}"
                                   class="form-control form-control-custom"/>
                        </div>

                        <div class="mb-3 text-center">
                            <label for="editAge" class="form-label fw-bold">Age</label>
                            <input type="number" id="editAge" th:field="*{age}"
                                   class="form-control form-control-custom"/>
                        </div>

                        <div class="mb-3 text-center">
                            <label for="editEmail" class="form-label fw-bold">Email</label>
                            <input type="email" id="editEmail" th:field="*{email}"
                                   class="form-control form-control-custom"/>
                        </div>

                        <div class="mb-3 text-center">
                            <label for="editPassword" class="form-label fw-bold">Password</label>
                            <input type="password" id="editPassword" th:field="*{password}"
                                   class="form-control form-control-custom"/>
                        </div>

                        <div class="mb-3 text-center">
                            <label for="editRoles" class="form-label fw-bold">Roles</label>
                            <select multiple id="editRoles" th:field="*{roles}" class="form-control form-roles-custom">
                                <option th:each="role : ${roles}" th:value="${role.id}"
                                        th:text="${#strings.replace(role.name,'ROLE_','')}">
                                </option>
                            </select>
                        </div>

                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-primary">Edit</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
