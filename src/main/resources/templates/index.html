<!DOCTYPE html> <!-- Определяет документ как HTML5 -->
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"> <!-- Кодировка документа -->
    <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- Адаптивность под мобильные устройства -->
    <title>Пользователи</title> <!-- Заголовок страницы -->
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet"> <!-- Подключение Bootstrap CSS -->
    <link th:href="@{/css/main.css}" rel="stylesheet"> <!-- Подключение собственного CSS --> </head>
<body> <!-- Верхняя панель (шапка) -->
<div class="container-fluid bg-dark py-3"> <!-- Контейнер шапки с темным фоном и вертикальным отступом -->
    <div class="row align-items-center"> <!-- Строка с выравниванием по вертикали -->
        <div class="col-11"> <!-- Основная часть шапки --> <h3 class="m-0"> <!-- Заголовок без внешнего отступа -->
            <span class="fw-bold text-white" th:text="${user?.email}">email</span>
            <!-- Адрес пользователя жирным белым --> <span class="mx-1">with roles:</span>
            <!-- Дополнительный текст с горизонтальным отступом --> <span th:each="role : ${user?.roles}"
                                                                          class="mx-1 fw-bold text-white"
                                                                          th:text="${#strings.replace(role.name,'ROLE_','')}">ROLE</span>
        </h3></div>
        <div class="col-1 text-end"> <!-- Колонка справа для кнопки выхода -->
            <form th:action="@{/logout}" th:method="post" class="d-flex">
                <button type="submit" class="btn btn-outline-secondary no-hover-fill" style="border: none;">Logout
                </button>
            </form><!-- Кнопка выхода --> </div>
    </div>
</div> <!-- Основной контейнер страницы -->
<div class="container-fluid px-0"> <!-- Контейнер без горизонтальных отступов -->
    <div class="row g-0"> <!-- Строка без промежутков между колонками --> <!-- Боковая панель -->
        <div class="col-2 bg-white min-vh-100 pt-3"> <!-- Панель слева с верхним отступом -->
            <button class="sidebar-btn active">Admin</button> <!-- Кнопка Admin активная -->
            <button class="sidebar-btn">User</button> <!-- Кнопка User --> </div> <!-- Основная область контента -->
        <div class="col-10 p-4 content-area"> <!-- Правая колонка с внутренними отступами --> <h1>Admin panel</h1>
            <!-- Заголовок страницы --> <!-- Вкладки -->
            <ul class="nav nav-tabs mb-0" id="myTab" role="tablist"> <!-- Контейнер для вкладок -->
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="users-tab" data-bs-toggle="tab" data-bs-target="#users"
                            type="button" role="tab">Users table
                    </button> <!-- Вкладка "Users table" активная --> </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="newuser-tab" data-bs-toggle="tab" data-bs-target="#newuser"
                            type="button" role="tab">New User
                    </button> <!-- Вкладка "New User" --> </li>
            </ul> <!-- Контент вкладок -->
            <div class="tab-content" id="myTabContent"> <!-- Контейнер содержимого вкладок --> <!-- Вкладка Users -->
                <div class="tab-pane fade show active" id="users" role="tabpanel" aria-labelledby="users-tab">
                    <div class="card border rounded"> <!-- Карточка с рамкой -->
                        <div class="card-header all-users-tab">All users</div> <!-- Заголовок карточки -->
                        <div class="card-body p-0"> <!-- Тело карточки без отступов -->
                            <div class="border-top" style="padding: 1.25rem;"><!-- Вложенный блок с верхней границей -->
                                <table class="table table-striped mb-4 border-top">
                                    <!-- Таблица с полосами и верхней границей -->
                                    <thead>
                                    <tr>
                                        <th scope="col">ID</th>
                                        <th scope="col">First Name</th>
                                        <th scope="col">Last Name</th>
                                        <th scope="col">Age</th>
                                        <th scope="col">Email</th>
                                        <th scope="col">Role</th>
                                        <th scope="col">Edit</th>
                                        <th scope="col">Delete</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="user : ${users}"> <!-- Перебор пользователей через Thymeleaf -->
                                        <td th:text="${user?.id}">ID</td>
                                        <td th:text="${user?.name}">First Name</td>
                                        <td th:text="${user?.surname}">Last Name</td>
                                        <td th:text="${user?.age}">Age</td>
                                        <td th:text="${user?.email}">Email</td>
                                        <td><span th:each="role : ${user.roles}"> <span
                                                th:text="${role?.name}">Role</span> </span></td>
                                        <td><a th:href="@{/admin/edit(id=${user.id})}">
                                            <button type="button" class="btn btn-edit-white">Edit</button>
                                        </a></td>
                                        <td>
                                            <form th:method="POST" th:action="@{/admin/delete?id={id}(id=${user.id})}">
                                                <button type="submit" class="btn btn-danger">Delete</button>
                                            </form>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div> <!-- /.card-body --> </div> <!-- /.card --> </div> <!-- /.tab-pane Users -->
                <!-- Вкладка New User -->
                <div class="tab-pane fade" id="newuser" role="tabpanel" aria-labelledby="newuser-tab">
                    <div class="card border rounded">
                        <div class="card-header new-user-tab">Add new user</div>
                        <div class="card-body p-3 new-form-container">
                            <div th:replace="new :: newUserForm"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
