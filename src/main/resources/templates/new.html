<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="newUserForm">
    <form th:action="@{/admin/new}" th:object="${newUser}" method="post">

        <div class="mb-3 text-center">
            <label for="name" class="form-label fw-bold">First name</label>
            <input type="text" id="name" th:field="*{name}" class="form-control form-control-custom">
        </div>

        <div class="mb-3 text-center">
            <label for="surname" class="form-label fw-bold">Last name</label>
            <input type="text" id="surname" th:field="*{surname}" class="form-control form-control-custom">
        </div>

        <div class="mb-3 text-center">
            <label for="age" class="form-label fw-bold">Age</label>
            <input type="number" id="age" th:field="*{age}" class="form-control form-control-custom">
        </div>

        <div class="mb-3 text-center">
            <label for="email" class="form-label fw-bold">Email</label>
            <input type="email" id="email" th:field="*{email}" class="form-control form-control-custom">
        </div>

        <div class="mb-3 text-center">
            <label for="password" class="form-label fw-bold">Password</label>
            <input type="password" id="password" th:field="*{password}" class="form-control form-control-custom">
        </div>

        <div class="mb-3 text-center">
            <label for="roles" class="form-label fw-bold">Roles</label>
            <select multiple id="roles" th:field="*{roles}" class="form-control form-roles-custom">
                <option th:each="role : ${roles}"
                        th:value="${role.id}"
                        th:text="${#strings.replace(role.name,'ROLE_','')}">
                </option>
            </select>
        </div>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="text-center">
            <button type="submit" class="btn btn-primary">Add new user</button>
        </div>
    </form>
</div>
</body>
</html>
