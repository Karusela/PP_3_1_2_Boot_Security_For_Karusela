<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create new user</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/main.css" rel="stylesheet">

    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
</head>
<body>
<div class="container-fluid bg-dark py-3">
    <div class="row align-items-center">
        <div class="col-11">
            <h3 class="m-0 d-flex flex-wrap align-items-center">
                <span id="currentUserEmail" class="fw-bold text-white">email</span>
                <span class="mx-1">with roles:</span>
                <span id="currentUserRoles" class="mx-1 fw-bold text-white">ROLE</span>
            </h3>
        </div>
        <div class="col-1 text-end">
            <form action="/logout" method="post" class="d-flex">
                <button type="submit" class="btn btn-outline-secondary no-hover-fill" style="border: none;">Logout
                </button>
            </form>
        </div>
    </div>
</div>

<div class="container-fluid px-0">
    <div class="row g-0">
        <div class="col-2 bg-white min-vh-100 pt-3">
            <button class="sidebar-btn active" onclick="location.href='/admin'">Admin</button>
            <button class="sidebar-btn" onclick="location.href='/profile'">User</button>
        </div>

        <div class="col-10 p-4 content-area">
            <h1>Add new user</h1>
            <div class="card border rounded">
                <div class="card-header all-users-tab">New user form</div>
                <div class="card-body">
                    <form id="newUserForm">
                        <div class="mb-3">
                            <label class="form-label">First name</label>
                            <input type="text" class="form-control" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Last name</label>
                            <input type="text" class="form-control" name="surname" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Age</label>
                            <input type="number" class="form-control" name="age" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" name="password" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Roles</label>
                            <select class="form-select" name="roles" multiple required id="rolesSelect">
                                <!-- роли будут подгружены через REST -->
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success">Add user</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const csrfToken = document.querySelector('meta[name="_csrf"]').content;
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

        async function loadCurrentUser() {
            try {
                const res = await fetch('/api/current-user');
                const user = await res.json();
                document.getElementById('currentUserEmail').textContent = user.email;
                document.getElementById('currentUserRoles').textContent =
                    user.roles.map(r => r.name.replace("ROLE_", "")).join(", ");
            } catch (e) {
                console.error("Ошибка загрузки текущего пользователя:", e);
            }
        }

        async function loadRoles() {
            try {
                const res = await fetch('/api/roles');
                const roles = await res.json();
                const select = document.getElementById('rolesSelect');
                select.innerHTML = "";
                roles.forEach(role => {
                    const option = document.createElement("option");
                    option.value = role.id;
                    option.textContent = role.name.replace("ROLE_", "");
                    select.appendChild(option);
                });
            } catch (e) {
                console.error("Ошибка загрузки ролей:", e);
            }
        }

        const form = document.getElementById('newUserForm');
        form.addEventListener('submit', async e => {
            e.preventDefault();

            const user = {
                name: form.name.value,
                surname: form.surname.value,
                age: parseInt(form.age.value),
                email: form.email.value,
                password: form.password.value,
                roles: Array.from(form.roles.selectedOptions).map(o => ({id: parseInt(o.value)}))
            };

            try {
                    const res = await fetch('/api/users', {
                        method: 'POST',
                        headers: {
                            "Content-Type": "application/json",
                            [csrfHeader]: csrfToken
                        },
                        body: JSON.stringify(user)
                    });

                    if (res.ok) {
                        window.location.assign("/admin");
                    } else {
                        const errText = await res.text();
                        console.error("Ошибка сервера:", errText);
                        alert("Ошибка при добавлении пользователя: " + errText);
                    }
                } catch (err) {
                    console.error("JS ошибка при отправке:", err);
                    alert("Ошибка JS: " + err);
                }
        });

        loadCurrentUser();
        loadRoles();
    });
</script>
</body>
</html>
