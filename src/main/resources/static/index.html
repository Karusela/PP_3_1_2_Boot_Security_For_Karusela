<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Пользователи</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/main.css" rel="stylesheet">

    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
</head>
<body>
<div class="container-fluid bg-dark header-small">
    <div class="row align-items-center">
        <div class="col-11">
            <h3 class="m-0 d-flex flex-wrap align-items-center">
                <span id="currentUserEmail" class="fw-bold text-white">email</span>
                <span class="mx-1">with roles:</span>
                <span id="currentUserRoles" class="mx-1 fw-bold text-white">ROLE</span>
            </h3>
        </div>
        <div class="col-1 text-end">
            <form action="/logout" method="post" class="d-flex">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-outline-secondary no-hover-fill" style="border: none;">Logout
                </button>
            </form>
        </div>
    </div>
</div>

<div class="container-fluid px-0">
    <div class="row g-0">
        <div class="col-2 bg-white min-vh-100 pt-3">
            <button class="sidebar-btn active" onclick="location.href='/admin'">Admin</button>
            <button class="sidebar-btn" onclick="location.href='/profile'">User</button>
        </div>
        <div class="col-10 p-4 content-area">
            <h1>Admin panel</h1>
            <ul class="nav nav-tabs mb-0" id="myTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="users-tab" data-bs-toggle="tab" data-bs-target="#users"
                            type="button" role="tab">Users table
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="newuser-tab" data-bs-toggle="tab" data-bs-target="#newuser"
                            type="button" role="tab">New User
                    </button>
                </li>
            </ul>

            <div class="tab-content" id="myTabContent">
                <div class="tab-pane fade show active" id="users" role="tabpanel" aria-labelledby="users-tab">
                    <div class="card border rounded">
                        <div class="card-header all-users-tab">All users</div>
                        <div class="card-body p-0">
                            <div class="border-top" style="padding: 1.25rem;">
                                <table class="table table-striped mb-4 border-top">
                                    <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>First Name</th>
                                        <th>Last Name</th>
                                        <th>Age</th>
                                        <th>Email</th>
                                        <th>Role</th>
                                        <th>Edit</th>
                                        <th>Delete</th>
                                    </tr>
                                    </thead>
                                    <tbody id="usersTableBody">
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="tab-pane fade" id="newuser" role="tabpanel" aria-labelledby="newuser-tab">
                    <div class="card border rounded">
                        <div class="card-header new-user-tab">Add new user</div>
                        <div class="card-body p-3 new-form-container">
                            <form id="newUserForm">
                                <div class="mb-3 text-center">
                                    <label for="name" class="form-label fw-bold">First name</label>
                                    <input type="text" id="name" name="name" class="form-control form-control-custom"
                                           required>
                                </div>
                                <div class="mb-3 text-center">
                                    <label for="surname" class="form-label fw-bold">Last name</label>
                                    <input type="text" id="surname" name="surname"
                                           class="form-control form-control-custom" required>
                                </div>
                                <div class="mb-3 text-center">
                                    <label for="age" class="form-label fw-bold">Age</label>
                                    <input type="number" id="age" name="age" class="form-control form-control-custom"
                                           required>
                                </div>
                                <div class="mb-3 text-center">
                                    <label for="email" class="form-label fw-bold">Email</label>
                                    <input type="email" id="email" name="email" class="form-control form-control-custom"
                                           required>
                                </div>
                                <div class="mb-3 text-center">
                                    <label for="password" class="form-label fw-bold">Password</label>
                                    <input type="password" id="password" name="password"
                                           class="form-control form-control-custom" required>
                                </div>
                                <div class="mb-3 text-center">
                                    <label for="roles" class="form-label fw-bold">Roles</label>
                                    <select multiple id="roles" name="roles" class="form-control form-roles-custom"
                                            required></select>
                                </div>
                                <div class="text-center">
                                    <button type="submit" class="btn btn-primary">Add new user</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="editUserModal" tabindex="-1" aria-labelledby="editUserModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit User</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editId">
                <div class="mb-3 text-center">
                    <label for="editName" class="form-label fw-bold">First name</label>
                    <input type="text" id="editName" class="form-control form-control-custom">
                </div>
                <div class="mb-3 text-center">
                    <label for="editSurname" class="form-label fw-bold">Last name</label>
                    <input type="text" id="editSurname" class="form-control form-control-custom">
                </div>
                <div class="mb-3 text-center">
                    <label for="editAge" class="form-label fw-bold">Age</label>
                    <input type="number" id="editAge" class="form-control form-control-custom">
                </div>
                <div class="mb-3 text-center">
                    <label for="editEmail" class="form-label fw-bold">Email</label>
                    <input type="email" id="editEmail" class="form-control form-control-custom">
                </div>
                <div class="mb-3 text-center">
                    <label for="editPassword" class="form-label fw-bold">Password</label>
                    <input type="password" id="editPassword" class="form-control form-control-custom">
                </div>
                <div class="mb-3 text-center">
                    <label for="editRoles" class="form-label fw-bold">Roles</label>
                    <select multiple id="editRoles" class="form-control form-roles-custom"></select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button id="saveEditBtn" type="button" class="btn btn-primary">Edit</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="deleteUserModal" tabindex="-1" aria-labelledby="deleteUserModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Delete User</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="deleteId">
                <div class="mb-3 text-center">
                    <label for="deleteName" class="form-label fw-bold">First name</label>
                    <input type="text" id="deleteName" class="form-control form-control-custom" readonly>
                </div>
                <div class="mb-3 text-center">
                    <label for="deleteSurname" class="form-label fw-bold">Last name</label>
                    <input type="text" id="deleteSurname" class="form-control form-control-custom" readonly>
                </div>
                <div class="mb-3 text-center">
                    <label for="deleteAge" class="form-label fw-bold">Age</label>
                    <input type="number" id="deleteAge" class="form-control form-control-custom" readonly>
                </div>
                <div class="mb-3 text-center">
                    <label for="deleteEmail" class="form-label fw-bold">Email</label>
                    <input type="email" id="deleteEmail" class="form-control form-control-custom" readonly>
                </div>
                <div class="mb-3 text-center">
                    <label for="deleteRoles" class="form-label fw-bold">Roles</label>
                    <select multiple id="deleteRoles" class="form-control form-roles-custom" disabled></select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button id="confirmDeleteBtn" type="button" class="btn btn-danger">Delete</button>
            </div>
        </div>
    </div>
</div>

<script src="/js/bootstrap.bundle.min.js"></script>
<script>
    const csrfToken = document.querySelector('meta[name="_csrf"]')?.content || '';
    let editModal = null;
    let deleteModal = null;
    let currentDeleteUserId = null;

    document.addEventListener('DOMContentLoaded', function() {
        editModal = new bootstrap.Modal(document.getElementById('editUserModal'));
        deleteModal = new bootstrap.Modal(document.getElementById('deleteUserModal'));
        initializeApp();
    });

    async function initializeApp() {
        await loadUsers();
        await loadRoles();
        await loadCurrentUser();
        setupEventListeners();
    }
    async function loadCurrentUser() {
    try {
        const res = await fetch('/api/current-user');
        if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
        const user = await res.json();

        document.getElementById('currentUserEmail').textContent = user.email || '';
        document.getElementById('currentUserRoles').textContent = user.roles
            .map(r => r.name.replace('ROLE_', ''))
            .join(', ') || '';
    } catch (error) {
        console.error("Error loading current user:", error);
    }
}

    async function loadUsers() {
        try {
            const res = await fetch('/api/users');
            if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
            const users = await res.json();
            const tbody = document.getElementById('usersTableBody');
            tbody.innerHTML = "";
            users.forEach(u => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${u.id}</td>
                    <td>${u.name}</td>
                    <td>${u.surname}</td>
                    <td>${u.age}</td>
                    <td>${u.email}</td>
                    <td>${u.roles.map(r => r.name.replace("ROLE_", "")).join(", ")}</td>
                    <td><button class="btn btn-edit-white" data-id="${u.id}">Edit</button></td>
                    <td><button class="btn btn-danger" data-id="${u.id}">Delete</button></td>
                `;
                tbody.appendChild(row);
            });
        } catch (error) {
            console.error("Error loading users:", error);
        }
    }

    async function loadRoles() {
        try {
            const res = await fetch('/api/roles');
            if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
            const roles = await res.json();

            ['roles', 'editRoles', 'deleteRoles'].forEach(id => {
                const select = document.getElementById(id);
                if (select) {
                    select.innerHTML = '';
                    roles.forEach(r => {
                        const opt = document.createElement('option');
                        opt.value = r.id;
                        opt.textContent = r.name.replace('ROLE_', '');
                        select.appendChild(opt);
                    });
                }
            });
        } catch (error) {
            console.error("Error loading roles:", error);
        }
    }

    async function openEditModal(userId) {
        if (!userId) return;
        try {
            const res = await fetch(`/api/users/${userId}`);
            if (!res.ok) return;
            const user = await res.json();

            document.getElementById('editId').value = user.id;
            document.getElementById('editName').value = user.name || '';
            document.getElementById('editSurname').value = user.surname || '';
            document.getElementById('editAge').value = user.age || '';
            document.getElementById('editEmail').value = user.email || '';
            document.getElementById('editPassword').value = '';

            const select = document.getElementById('editRoles');
            Array.from(select.options).forEach(option => {
                option.selected = user.roles.some(r => r.id === parseInt(option.value));
            });

            editModal.show();
        } catch (error) {
            console.error("Ignored error opening edit modal:", error);
        }
    }

    async function openDeleteModal(userId) {
        if (!userId) return;
        try {
            const res = await fetch(`/api/users/${userId}`);
            if (!res.ok) return;
            const user = await res.json();
            currentDeleteUserId = user.id;

            document.getElementById('deleteId').value = user.id;
            document.getElementById('deleteName').value = user.name || '';
            document.getElementById('deleteSurname').value = user.surname || '';
            document.getElementById('deleteAge').value = user.age || '';
            document.getElementById('deleteEmail').value = user.email || '';

            const select = document.getElementById('deleteRoles');
            Array.from(select.options).forEach(option => {
                option.selected = user.roles.some(r => r.id === parseInt(option.value));
            });

            deleteModal.show();
        } catch (error) {
            console.error("Ignored error opening delete modal:", error);
        }
    }

    function setupEventListeners() {
        document.addEventListener('click', e => {
            if (e.target && e.target.matches('.btn-edit-white')) {
                const userId = e.target.dataset.id;
                openEditModal(userId);
            }
            if (e.target && e.target.matches('.btn-danger')) {
                const userId = e.target.dataset.id;
                openDeleteModal(userId);
            }
        });

        document.getElementById('saveEditBtn').addEventListener('click', async () => {
            await saveEditUser();
        });

        document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
            await deleteUser();
        });

        document.getElementById('newUserForm').addEventListener('submit', async e => {
            e.preventDefault();
            await createNewUser(e.target);
        });

        document.getElementById('deleteUserModal').addEventListener('hidden.bs.modal', () => {
            currentDeleteUserId = null;
        });
    }


    async function saveEditUser() {
        try {
            const userData = {
                id: parseInt(document.getElementById('editId').value),
                name: document.getElementById('editName').value,
                surname: document.getElementById('editSurname').value,
                age: parseInt(document.getElementById('editAge').value) || 0,
                email: document.getElementById('editEmail').value,
                password: document.getElementById('editPassword').value,
                roles: Array.from(document.getElementById('editRoles').selectedOptions)
                            .map(o => ({ id: parseInt(o.value) }))
            };

            if (!userData.password) delete userData.password;

            const res = await fetch(`/api/users/${userData.id}`, {
                method: 'PUT',
                headers: { "Content-Type": "application/json", "X-CSRF-TOKEN": csrfToken },
                body: JSON.stringify(userData)
            });

            if (res.ok) {
                await loadUsers();
                editModal.hide();
            } else {
                console.error("Server error response:", await res.text());
            }
        } catch (error) {
            console.error("Ignored error saving user:", error);
        }
    }

    async function deleteUser() {
        if (!currentDeleteUserId) return;

        try {
            const res = await fetch(`/api/users/${currentDeleteUserId}`, {
                method: 'DELETE',
                headers: { "X-CSRF-TOKEN": csrfToken }
            });

            if (res.ok) {
                await loadUsers();
                deleteModal.hide();
            }
        } catch (error) {
            console.error("Ignored error deleting user:", error);
        }
    }

    async function createNewUser(form) {
        try {
            const userData = {
                name: form.name.value,
                surname: form.surname.value,
                age: parseInt(form.age.value) || 0,
                email: form.email.value,
                password: form.password.value,
                roles: Array.from(form.roles.selectedOptions).map(o => ({ id: parseInt(o.value) }))
            };

            const res = await fetch('/api/users', {
                method: 'POST',
                headers: { "Content-Type": "application/json", "X-CSRF-TOKEN": csrfToken },
                body: JSON.stringify(userData)
            });

            if (res.ok) {
                await loadUsers();
                form.reset();
                document.querySelector('#users-tab').click();
            }
        } catch (error) {
            console.error("Ignored error creating user:", error);
        }
    }
</script>
</body>
</html>
