<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="deleteUserForm">
    <div class="modal fade" id="deleteUserModal" tabindex="-1" aria-labelledby="deleteUserModalLabel"
         aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Delete User</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form th:action="@{/admin/delete}" method="post">
                    <div class="modal-body">
                        <input type="hidden" id="deleteId" name="id"/>

                        <div class="mb-3 text-center">
                            <label for="deleteName" class="form-label fw-bold">First name</label>
                            <input type="text" id="deleteName" class="form-control form-control-custom" readonly/>
                        </div>

                        <div class="mb-3 text-center">
                            <label for="deleteSurname" class="form-label fw-bold">Last name</label>
                            <input type="text" id="deleteSurname" class="form-control form-control-custom" readonly/>
                        </div>

                        <div class="mb-3 text-center">
                            <label for="deleteAge" class="form-label fw-bold">Age</label>
                            <input type="number" id="deleteAge" class="form-control form-control-custom" readonly/>
                        </div>

                        <div class="mb-3 text-center">
                            <label for="deleteEmail" class="form-label fw-bold">Email</label>
                            <input type="email" id="deleteEmail" class="form-control form-control-custom" readonly/>
                        </div>

                        <div class="mb-3 text-center">
                            <label for="deleteRoles" class="form-label fw-bold">Roles</label>
                            <select multiple id="deleteRoles" class="form-control form-roles-custom" disabled>
                                <option th:each="role : ${roles}" th:value="${role.id}"
                                        th:text="${#strings.replace(role.name,'ROLE_','')}"></option>
                            </select>
                        </div>

                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-danger">Delete</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
